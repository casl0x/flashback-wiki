name: Prisma migrate deploy

on:
  push:
    branches: [main]
    paths:
      - "prisma/migrations/**"
  workflow_dispatch: {}

# Une seule migration à la fois : remplace la protection du verrou Postgres désactivé plus bas.
concurrency:
  group: prisma-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          # pg_advisory_lock expire de façon intermittente (P1002) ; ce workflow est le seul
          # à migrer et ses exécutions sont sérialisées par `concurrency`.
          PRISMA_SCHEMA_DISABLE_ADVISORY_LOCK: "1"
